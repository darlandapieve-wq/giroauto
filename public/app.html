<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GiroAuto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<section id="login" hidden>
  <form class="login-card" id="authForm" novalidate>
    <div class="brand"><div class="brand-mark">G</div><div class="brand-name">GiroAuto</div></div>
    <div class="auth-tabs" role="group" aria-label="Acesso">
      <button type="button" data-mode="login" aria-pressed="true">Entrar</button>
      <button type="button" data-mode="register" aria-pressed="false">Criar conta</button>
    </div>
    <div id="regFields" hidden style="display:flex;flex-direction:column;gap:12px">
      <div class="f w6"><label for="a-loja">Nome da loja</label><input id="a-loja" autocomplete="organization"></div>
      <div class="f w6"><label for="a-nome">Seu nome</label><input id="a-nome" autocomplete="name"></div>
    </div>
    <div class="f w6"><label for="a-email">E-mail</label><input id="a-email" type="email" autocomplete="username"></div>
    <div class="f w6"><label for="a-senha">Senha</label><input id="a-senha" type="password" autocomplete="current-password"></div>
    <div class="err" id="authErr" hidden></div>
    <button class="btn primary" type="submit" id="authBtn">Entrar</button>
  </form>
</section>

<div id="app" hidden>
  <aside class="side">
    <div class="brand"><div class="brand-mark">G</div><div class="brand-name">GiroAuto</div></div>
    <nav class="nav" aria-label="Seções">
      <button data-view="estoque"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 13l2-5a2 2 0 0 1 2-1.4h10A2 2 0 0 1 19 8l2 5v4h-2"/><path d="M5 17H3v-4h18"/><circle cx="7.5" cy="17" r="1.8"/><circle cx="16.5" cy="17" r="1.8"/></svg>Estoque<span class="count" id="c-estoque"></span></button>
      <button data-view="novo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>Novo veículo</button>
      <button data-view="republicacao"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/></svg>Republicação<span class="count" id="c-org"></span></button>
      <button data-view="campanhas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10v4l11 5V5L4 10z"/><path d="M15 9a3 3 0 0 1 0 6"/><path d="M7 14l1 5h3l-1-4"/></svg>Campanhas<span class="count" id="c-camp"></span></button>
      <button data-view="config"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Configurações</button>
    </nav>
    <div class="side-foot">
      <div class="ext" id="extBox"><span class="dot" id="extDot"></span><div><b id="extTitle">Extensão</b><span id="extSub"></span></div></div>
      <div class="store"><b id="storeName"></b><span id="userName"></span></div>
      <button class="btn ghost sm" id="logout" type="button">Sair</button>
      <span class="sub" id="appVersion" style="text-align:center"></span>
    </div>
  </aside>
  <main id="main"><div class="loading">Carregando…</div></main>
</div>

<div id="modalRoot"></div>
<div id="toast" hidden role="status"></div>
<script src="/app.js"></script>
</body>
</html>
