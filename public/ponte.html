<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GiroAuto · Preenchimento</title>
<style>
  :root{--bg:#eff1f4;--surface:#fff;--ink:#161a21;--muted:#5b6370;--line:#d9dde4;--accent:#efa91c;--ok:#1d7f48;--okbg:#ddf2e5;--bad:#b0352a;--badbg:#f8e0dd}
  @media (prefers-color-scheme:dark){:root{--bg:#111318;--surface:#1a1d24;--ink:#e8eaee;--muted:#9aa2ae;--line:#2b3039;--accent:#f2b42f;--ok:#56c788;--okbg:#173527;--bad:#f07b6f;--badbg:#3d1e1b;color-scheme:dark}}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .w{max-width:420px;margin:0 auto;padding:20px 16px;display:flex;flex-direction:column;gap:12px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
  .brand i{width:28px;height:28px;border-radius:6px;background:var(--accent);color:#1b1400;display:grid;place-items:center;font-style:normal}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
  .muted{color:var(--muted)}
  .ok{background:var(--okbg);color:var(--ok);border-radius:8px;padding:10px}
  .err{background:var(--badbg);color:var(--bad);border-radius:8px;padding:10px}
  button,a.btn{font:inherit;border:1px solid var(--line);background:var(--surface);color:inherit;border-radius:7px;padding:8px 12px;cursor:pointer;text-decoration:none;text-align:center}
  button.p{background:var(--accent);border-color:var(--accent);color:#1b1400;font-weight:600}
  img{width:72px;height:54px;object-fit:cover;border-radius:5px;background:var(--line)}
  .row{display:flex;gap:10px;align-items:center}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="w">
  <div class="brand"><i>G</i>GiroAuto</div>
  <div class="card" id="box"><span class="muted">Carregando…</span></div>
</div>
<script src="/ponte.js"></script>
</body>
</html>
